name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build DMG
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app
        run: ./build.sh

      - name: Create DMG
        run: ./Scripts/create_dmg.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            "build/ForbiddenTrackpad.dmg" \
            --title "Forbidden Trackpad $TAG_NAME" \
            --notes "Ad-hoc signed macOS build. The app is not notarized yet, so macOS may require Right-click -> Open or Privacy & Security -> Open Anyway on first launch."
